[package]
version = "0.1.0"
name = "satchel"
description = "Multi-account Lightning wallet and Lightning Address server for test networks (Mutinynet/signet). Not for mainnet."
authors = ["Luis Schwab <dev@luisschwab.net>", "Tee8z <tee8z@protonmail.com>"]
repository = "https://github.com/tee8z/satchel"
keywords = ["bitcoin", "lightning", "lnd", "lnurl", "signet"]
license = "MIT OR Apache-2.0"
readme = "README.md"
edition = "2024"
rust-version = "1.95.0" # Matches the pinned Nix compiler.
publish = false

[[bin]]
name = "satchel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = "0.8.9"
base64 = "0.22.1"
bech32 = "0.11.0"
clap = { version = "4.6.3", features = ["derive", "env"] }
getrandom = "0.3.4"
hex = "0.4.3"
maud = { version = "0.27.0", features = ["axum"] }
qrcode = { version = "0.14.1", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }
secp256k1 = { version = "0.31.1", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "net", "macros", "sync", "signal", "time"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Password hashing is far too slow unoptimised; keep debug and test builds usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The release workflow reads the pinned compiler from here.
[package.metadata.rbmt]
toolchains = { stable = "1.97.1" }
