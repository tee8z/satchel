version: 2

# One grouped pull request per ecosystem each week. Releases must be a week
# old before they are proposed; security updates are not delayed.
updates:
    - package-ecosystem: "cargo"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "06:00"
          timezone: "Etc/UTC"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 2
      commit-message:
          prefix: "chore(deps)"
      groups:
          cargo:
              applies-to: version-updates
              patterns: ["*"]
          cargo-security:
              applies-to: security-updates
              patterns: ["*"]

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "06:00"
          timezone: "Etc/UTC"
      cooldown:
          default-days: 7
      open-pull-requests-limit: 2
      commit-message:
          prefix: "ci(deps)"
      groups:
          github-actions:
              applies-to: version-updates
              patterns: ["*"]
