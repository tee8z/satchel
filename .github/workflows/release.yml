name: Release

# Releases are explicitly dispatched; pushes and pull requests do not build.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (requires the matching version tag)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: satchel-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      revision: ${{ steps.metadata.outputs.revision }}
      toolchain: ${{ steps.metadata.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version, tag, and TLS dependency source
        id: metadata
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import tomllib

          def main():
              manifest = tomllib.loads(Path("Cargo.toml").read_text())
              lock = tomllib.loads(Path("Cargo.lock").read_text())
              version = manifest["package"]["version"]
              toolchain = manifest["package"]["metadata"]["rbmt"]["toolchains"]["stable"]
              for value in (version, toolchain):
                  if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", value):
                      raise SystemExit("Release version and compiler must be stable versions")
              if any(package["name"] == "openssl-src" for package in lock["package"]):
                  raise SystemExit("Release must use the separately verified OpenSSL source")
              if os.environ["PUBLISH"] == "true":
                  if os.environ["GITHUB_REF_TYPE"] != "tag" or os.environ["GITHUB_REF_NAME"] != f"v{version}":
                      raise SystemExit("Publish from the tag matching Cargo.toml")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"version={version}\nrevision={os.environ['GITHUB_SHA']}\ntoolchain={toolchain}\n")

          main()
          PY

  build:
    name: Build release (${{ matrix.system }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - system: aarch64-linux
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Install the pinned Rust compiler
        env:
          TOOLCHAIN: ${{ needs.prepare.outputs.toolchain }}
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update --target "$TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}-openssl-${{ hashFiles('scripts/build-release-openssl.sh') }}
      - name: Build verified static OpenSSL
        run: bash scripts/build-release-openssl.sh "$RUNNER_TEMP/release-openssl"
      - name: Build the locked application binary
        env:
          TOOLCHAIN: ${{ needs.prepare.outputs.toolchain }}
          TARGET: ${{ matrix.target }}
          OPENSSL_NO_VENDOR: "1"
          OPENSSL_STATIC: "1"
          OPENSSL_DIR: ${{ runner.temp }}/release-openssl
        run: cargo +"$TOOLCHAIN" build --release --locked --target "$TARGET" --bin satchel
      - name: Verify and package the release binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          SYSTEM: ${{ matrix.system }}
          TARGET: ${{ matrix.target }}
        run: |
          bash scripts/package-release.sh "$VERSION" "$SYSTEM" "$REVISION" \
            "target/$TARGET/release/satchel" "$RUNNER_TEMP/release-openssl" release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: satchel-${{ matrix.system }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified archives
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: satchel-*-linux
          path: release
          merge-multiple: true
      - name: Verify checksums and publish the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: |
          cd release
          sha256sum --check ./*.sha256
          tag_revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$VERSION" --jq .sha)
          if [ "$tag_revision" != "$REVISION" ]; then
            echo "Release tag changed after source validation" >&2
            exit 1
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "v$VERSION" --generate-notes ./*.tar.gz ./*.sha256

  image:
    name: Publish container image
    needs: [prepare, publish]
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/tee8z/satchel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      # The image packages the archives built and published above; nothing is compiled here.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: satchel-*-linux
          path: dist
          merge-multiple: true
      - name: Verify the release archives
        working-directory: dist
        run: sha256sum --check ./*.sha256
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: SATCHEL_VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.prepare.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
